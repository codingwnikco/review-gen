<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Free Google Review Link Generator</title>
  <meta name="description" content="Generate a direct Google review link for your business in seconds.">

  <!-- PWA & Mobile Web App -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ReviewGen">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="screen-layout">

    <!-- Generator Card exactly as pictured in the screenshot -->
    <main class="generator-card">

      <!-- 5 Color Google Stars -->
      <div class="stars-header">
        <span class="star star-blue">★</span>
        <span class="star star-red">★</span>
        <span class="star star-yellow">★</span>
        <span class="star star-blue2">★</span>
        <span class="star star-green">★</span>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="main-title">Google Review Link Generator</h1>
      <p class="subtitle">
        MADE BY NICOLAS MITTER - INSTAGRAM: @mitter.n
      </p>

      <!-- Badges -->
      <div class="badges-row">
        <span class="badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
          ZADARMO
        </span>
        <span class="badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Pre vsetkych
        </span>
      </div>

      <!-- Form -->
      <form id="reviewLinkForm" onsubmit="return false;" class="form-body">
        <label for="mapsInput" class="input-label">Business name or Google Maps link:</label>

        <div class="input-container">
          <input type="text" id="mapsInput" placeholder="e.g. https://maps.app.goo.gl/nExshUaxh8eSaXgJ8"
            class="main-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <div class="input-buttons-group">
            <button type="button" class="btn-clear" id="clearBtn" title="Vymazať text" style="display: none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <button type="button" class="btn-paste" id="pasteBtn" title="Paste from clipboard">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Paste</span>
            </button>
          </div>
        </div>

        <button type="submit" id="generateReviewBtn" class="btn-primary">
          <span id="btnText">Generate Review Link &rarr;</span>
          <span id="btnLoader" class="loader-spinner" style="display: none;"></span>
        </button>
      </form>

      <!-- Result Section -->
      <div class="result-section" id="generatorResultBox" style="display: none;">

        <div class="result-group">
          <span class="section-tag">YOUR GOOGLE REVIEW LINK</span>
          <div class="result-input-row">
            <input type="text" id="finalGeneratedLink" readonly class="result-input">
            <button type="button" class="btn-copy" id="copyResultBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span id="copyBtnText">Copy</span>
            </button>
          </div>

          <div class="link-actions">
            <a href="#" id="testLinkAnchor" target="_blank" rel="noopener noreferrer" class="test-link">
              Otestovať link v novom okne ↗
            </a>
          </div>
        </div>

        <!-- QR Code Section -->
        <div class="result-group qr-group">
          <span class="section-tag">YOUR GOOGLE REVIEW QR CODE</span>
          <div class="qr-preview-wrapper">
            <div id="qrcodeCanvas"></div>
          </div>
          <button type="button" class="btn-download" id="downloadQrBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Stiahnuť QR kód (PNG)
          </button>
        </div>

      </div>

    </main>

    <!-- Instagram Badge with Glowing Interactive Effect -->
    <footer class="social-footer">
      <a href="https://instagram.com/mitter.n" target="_blank" rel="noopener noreferrer" class="instagram-pill">
        <span class="ig-icon-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </span>
        <span class="ig-text">mitter.n</span>
      </a>
    </footer>

  </div>

  <!-- Toast -->
  <div class="toast" id="toastNotification">
    <span id="toastMessage">Skopírované!</span>
  </div>

  <script src="./qrcode.min.js"></script>
  <script src="./app.js?v=3"></script>
</body>

</html>
